name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 macOS 依赖（libmpv）
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      - name: 安装前端依赖
        run: npm install

      # Release 用 release 构建（关闭调试信息，体积小性能好）
      - name: 构建 release
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: 内嵌 libmpv 运行时（macOS 开箱即用）
        if: matrix.os == 'macos-latest'
        run: |
          brew install dylibbundler
          APP="src-tauri/target/release/bundle/macos/LiveSub-Player.app"
          # 递归收集主程序依赖的动态库（libmpv 及其 Homebrew 依赖树）拷进 .app 并重写路径
          dylibbundler -cd -b -x "$APP/Contents/MacOS/livesub-player" -d "$APP/Contents/libs"
          # dylibbundler 会给内嵌库写重复的 LC_RPATH，dyld 拒绝加载——全部删掉
          # （依赖路径已是 @executable_path/../libs/ 直达，rpath 无必要）
          for f in "$APP/Contents/libs/"*; do
            n=$(otool -l "$f" | grep -c "path @executable_path/../libs/" || true)
            for i in $(seq 1 "$n"); do install_name_tool -delete_rpath "@executable_path/../libs/" "$f" 2>/dev/null || true; done
            codesign --force -s - "$f"
          done
          # ad-hoc 重签保持包有效
          codesign --force --deep -s - "$APP"

      - name: 打包 macOS .app 为 zip
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -qry "$GITHUB_WORKSPACE/LiveSub-Player-macOS.zip" LiveSub-Player.app

      - name: 上传产物（Linux）
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-ubuntu
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传产物（Windows）
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传产物（macOS）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-macos
          path: LiveSub-Player-macOS.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.zip

      # 历史版本没有保留价值：仅保留最近 3 个 Release（含本次），
      # 更早的连 Release 带 tag 一起删，避免 Release 页和 tag 列表堆积
      - name: 清理旧 Release（仅保留最近 3 个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[3:][] | [.id, .tag_name] | @tsv' \
            | while IFS=$'\t' read -r id tag; do
                echo "删除旧 Release: $tag (id=$id)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" || true
              done
