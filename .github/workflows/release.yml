name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 macOS 依赖（libmpv）
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      - name: 安装前端依赖
        run: npm install

      # Release 用 release 构建（关闭调试信息，体积小性能好）
      - name: 构建 release
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      # Windows 更新包：对 NSIS 安装器做 minisign 签名（latest.json 引用）
      # 注意：npm run 会把 cwd 重置回 package.json 所在的仓库根，
      # 签名路径必须写全（先 ls 拿文件名，再回仓库根用相对全路径签名）
      - name: 签名自动更新包（Windows）
        if: matrix.os == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          f=$(ls *-setup.exe | head -n 1)
          cd "$GITHUB_WORKSPACE"
          npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
            --app-version "${GITHUB_REF_NAME#v}" "src-tauri/target/release/bundle/nsis/$f"
          ls -l src-tauri/target/release/bundle/nsis/*.exe*

      - name: 内嵌 libmpv 运行时（macOS 开箱即用）
        if: matrix.os == 'macos-latest'
        run: |
          brew install dylibbundler
          APP="src-tauri/target/release/bundle/macos/LiveSub-Player.app"
          # 递归收集主程序依赖的动态库（libmpv 及其 Homebrew 依赖树）拷进 .app 并重写路径
          dylibbundler -cd -b -x "$APP/Contents/MacOS/livesub-player" -d "$APP/Contents/libs"
          # dylibbundler 会给内嵌库写重复的 LC_RPATH，dyld 拒绝加载——全部删掉
          # （依赖路径已是 @executable_path/../libs/ 直达，rpath 无必要）
          for f in "$APP/Contents/libs/"*; do
            n=$(otool -l "$f" | grep -c "path @executable_path/../libs/" || true)
            for i in $(seq 1 "$n"); do install_name_tool -delete_rpath "@executable_path/../libs/" "$f" 2>/dev/null || true; done
            codesign --force -s - "$f"
          done
          # ad-hoc 重签保持包有效
          codesign --force --deep -s - "$APP"

      - name: 打包 macOS .app 为 zip
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -qry "$GITHUB_WORKSPACE/LiveSub-Player-macOS.zip" LiveSub-Player.app

      # 标准 macOS 安装方式：打开 dmg 拖入 Applications。
      # 不能用 tauri bundler 的 dmg——它在 dylibbundler 内嵌 libmpv 之前打包，会缺运行时；
      # 必须在内嵌+重签之后手工 hdiutil 制作（app + Applications 软链 = 拖拽窗口）
      - name: 制作 macOS 安装 dmg（拖入 Applications）
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dmg-stage
          cp -R src-tauri/target/release/bundle/macos/LiveSub-Player.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "LiveSub-Player" -srcfolder dmg-stage -ov -format UDZO \
            "$GITHUB_WORKSPACE/LiveSub-Player.dmg"
          rm -rf dmg-stage

      # 自动更新包：必须在内嵌 libmpv + 重签之后再打 tar（bundler 自带产物是内嵌前的），
      # 手工 minisign 签名（createUpdaterArtifacts 保持 false，本地构建无需密钥）
      - name: 打自动更新包并签名（macOS）
        if: matrix.os == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf "$GITHUB_WORKSPACE/LiveSub-Player.app.tar.gz" LiveSub-Player.app
          cd "$GITHUB_WORKSPACE"
          npm run tauri -- signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" \
            --app-version "${GITHUB_REF_NAME#v}" "LiveSub-Player.app.tar.gz"
          ls -l LiveSub-Player.app.tar.gz*

      - name: 上传产物（Linux）
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-ubuntu
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传产物（Windows）
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: 上传产物（macOS）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: livesub-macos
          path: |
            LiveSub-Player-macOS.zip
            LiveSub-Player.dmg
            LiveSub-Player.app.tar.gz
            LiveSub-Player.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 latest.json（自动更新清单）
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag[1:] if tag.startswith("v") else tag
          base = f"https://github.com/{repo}/releases/download/{tag}"
          # 签名文件是 minisign 多行文本，必须原样读入再 json 序列化（不能 shell 拼接）
          mac_sig = open("artifacts/LiveSub-Player.app.tar.gz.sig").read().strip()
          win_exe = next(f for f in os.listdir("artifacts") if f.endswith("-setup.exe"))
          win_sig = open(os.path.join("artifacts", win_exe + ".sig")).read().strip()
          data = {
              "version": version,
              "notes": f"LiveSub-Player {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {"signature": mac_sig, "url": f"{base}/LiveSub-Player.app.tar.gz"},
                  "windows-x86_64": {"signature": win_sig, "url": f"{base}/{win_exe}"},
              },
          }
          json.dump(data, open("latest.json", "w"), indent=2)
          print(open("latest.json").read())
          PY

      # 必须 prerelease: false：releases/latest 不含 prerelease，否则 updater 端点解析不到
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.sig
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            latest.json

      # 历史版本没有保留价值：仅保留最近 3 个 Release（含本次），
      # 更早的连 Release 带 tag 一起删，避免 Release 页和 tag 列表堆积
      - name: 清理旧 Release（仅保留最近 3 个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[3:][] | [.id, .tag_name] | @tsv' \
            | while IFS=$'\t' read -r id tag; do
                echo "删除旧 Release: $tag (id=$id)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" || true
              done
