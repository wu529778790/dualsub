name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 macOS 依赖（libmpv）
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      - name: 安装前端依赖
        run: npm install

      # Release 用 release 构建（关闭调试信息，体积小性能好）
      - name: 构建 release
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: 打包 macOS .app 为 zip
        if: matrix.os == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -qry "$GITHUB_WORKSPACE/DualSub-macOS.zip" DualSub.app

      - name: 上传产物（Linux）
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: dualsub-ubuntu
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: 上传产物（Windows）
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dualsub-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 上传产物（macOS）
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dualsub-macos
          path: DualSub-macOS.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.exe
            artifacts/*.zip
