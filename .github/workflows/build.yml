name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      # whisper.cpp 需要 filesystem 特性（macOS 10.15+）；
      # whisper-rs-sys 会把 CMAKE_* 环境变量透传给 cmake（cmake crate 不读 MACOSX_*）
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 macOS 依赖（libmpv）
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      - name: 安装前端依赖
        run: npm install

      - name: 构建（debug，验证可编译可打包）
        run: npm run tauri -- build --debug --bundles ${{ matrix.bundles }}
