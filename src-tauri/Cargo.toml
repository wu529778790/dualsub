[package]
name = "livesub-player"
version = "1.0.2"
description = "打开视频，字幕跟上。跨平台桌面播放器，实时双语字幕，全离线运行。"
edition = "2021"
default-run = "livesub-player"

[lib]
name = "livesub_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.14"
encoding_rs = "0.8"
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics", "NSColor"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
