[package]
name = "dualsub"
version = "0.1.0"
description = "打开视频，字幕跟上。跨平台桌面播放器，实时双语字幕，全离线运行。"
edition = "2021"

[lib]
name = "dualsub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSGraphics"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
